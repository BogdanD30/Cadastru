services:
  db:
    image: postgres:17
    container_name: cadastru-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - cadastru-data:/var/lib/postgresql/data
      - ./docs/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cadastru-pgadmin
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - cadastru-pgadmin:/var/lib/pgadmin
      - ./docs/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  cadastru-data:
  cadastru-pgadmin:
